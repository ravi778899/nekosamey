<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<style>
body {
   margin: 0;
   padding: 0;
   text-align: center;
   font-family: Arial;
   background: linear-gradient(45deg, #ff9a9e, #fad0c4);
   overflow: hidden;
}
img {
   width: 220px;
   height: 220px;
   object-fit: cover;
   border-radius: 50%;
   margin-top: 60px;
   box-shadow: 0 0 25px pink;
   border: 5px solid white;
}
h1 {
   margin-top: 20px;
   color: white;
   font-size: 28px;
   text-shadow: 0 0 10px red, 0 0 20px hotpink;
}
.glow {
   font-size: 35px;
   color: #fff;
   animation: glow 1s infinite alternate;
}
@keyframes glow {
   from { text-shadow: 0 0 10px #ff4da6; }
   to { text-shadow: 0 0 30px #ff0066; }
}
button {
   padding: 12px 25px;
   font-size: 18px;
   margin: 15px;
   border-radius: 30px;
   border: none;
   cursor: pointer;
}
.yes { background: #ff4d6d; color: white; }
.no { background: gray; color: white; }
.heart {
   position: fixed;
   color: red;
   animation: float 5s linear infinite;
}
@keyframes float {
   0% { transform: translateY(100vh); opacity: 1; }
   100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>
<body>
<img src="74c72e1b-aed5-47fc-9682-9385aff55fc3.jpg">
<h1 id="message"></h1>
<div class="glow">I Love You Srav ❤️</div>
<button class="yes" onclick="yes()">Yes 💖</button>
<button class="no" onclick="no()">No 😅</button>
<audio autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>
<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Someone";
const valentineName = params.get("valentineName") || "Beautiful";
document.getElementById("message").innerHTML =
"Hey " + valentineName + " ❤️<br><br>Will you be my Valentine, " + name + "?";
// Floating hearts
function createHeart() {
   const heart = document.createElement("div");
   heart.classList.add("heart");
   heart.innerHTML = "❤️";
   heart.style.left = Math.random() * 100 + "vw";
   heart.style.fontSize = Math.random() * 20 + 20 + "px";
   document.body.appendChild(heart);
   setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 500);
// YES surprise
function yes(){
   document.body.innerHTML = `
<h1 class="glow" style="margin-top:200px;">
       YAYYYYY 💕<br><br>
       I Love You Forever Srav ❤️
</h1>
   `;
}
// NO response
function no(){
   alert("Are you sure? 🥺 Try again 😅");
}
</script>
</body>
</html>
