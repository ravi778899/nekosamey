<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<style>
body {
   margin: 0;
   padding: 0;
   text-align: center;
   font-family: Arial;
   background: linear-gradient(45deg, #ff758c, #ff7eb3);
   overflow: hidden;
}
img {
   width: 320px;
   height: 320px;
   object-fit: cover;
   border-radius: 50%;
   margin-top: 40px;
   box-shadow: 0 0 30px pink;
   border: 6px solid white;
}
h1 {
   color: white;
   font-size: 38px;
}
.glow {
   font-size: 45px;
   animation: glow 1s infinite alternate;
}
@keyframes glow {
   from { text-shadow: 0 0 10px #ff4da6; }
   to { text-shadow: 0 0 35px #ff0066; }
}
button {
   padding: 15px 35px;
   font-size: 22px;
   margin: 20px;
   border-radius: 40px;
   border: none;
   cursor: pointer;
}
.yes { background: #ff1744; color: white; }
.no { background: gray; color: white; }
</style>
</head>
<body>
<img id="mainImage" src="74c72e1b-aed5-47fc-9682-9385aff55fc3.jpg">
<h1 id="message"></h1>
<div class="glow">I Love You Srav ❤️</div>
<button class="yes" onclick="yes()">Yes 💖</button>
<button class="no" onclick="no()">No 😅</button>
<!-- Audio -->
<audio id="bgMusic" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Ravi";
const valentineName = params.get("valentineName") || "Srav";
document.getElementById("message").innerHTML =
"Hey " + valentineName + " ❤️<br><br>Will you be my Valentine, " + name + "?";
// YES function
function yes(){
   const music = document.getElementById("bgMusic");
   music.play();
   document.body.innerHTML = `
<img src="love.jpg" style="width:350px;height:350px;border-radius:50%;margin-top:60px;">
<h1 class="glow" style="margin-top:40px;">
       YAYYYYY 💕<br><br>
       I Love You Forever ${valentineName} ❤️<br><br>
       You Are My Everything 💖
</h1>
   `;
}
// NO function
function no(){
   alert("Are you sure? 🥺 Think again 😜");
}
</script>
</body>
</html>
