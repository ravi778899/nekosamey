<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<style>
body {
   margin: 0;
   padding: 0;
   text-align: center;
   font-family: Arial;
   background: linear-gradient(45deg, #ff758c, #ff7eb3);
}
img {
   width: 300px;
   height: 300px;
   object-fit: cover;
   border-radius: 50%;
   margin-top: 40px;
   box-shadow: 0 0 30px pink;
   border: 6px solid white;
}
h1 {
   color: white;
   font-size: 32px;
}
.glow {
   font-size: 40px;
   animation: glow 1s infinite alternate;
}
@keyframes glow {
   from { text-shadow: 0 0 10px #ff4da6; }
   to { text-shadow: 0 0 35px #ff0066; }
}
button {
   padding: 15px 35px;
   font-size: 20px;
   margin: 15px;
   border-radius: 40px;
   border: none;
   cursor: pointer;
}
.yes { background: #ff1744; color: white; }
.no { background: gray; color: white; }
</style>
</head>
<body>
<img id="photo" src="74c72e1b-aed5-47fc-9682-9385aff55fc3.jpg">
<h1 id="question"></h1>
<div id="extraText" class="glow">I Love You Srav ❤️</div>
<button class="yes" onclick="yesClicked()">Yes 💖</button>
<button class="no" onclick="noClicked()">No 😅</button>
<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Ravi";
const valentineName = params.get("valentineName") || "Srav";
document.getElementById("question").innerHTML =
"Hey " + valentineName + " ❤️<br><br>Will you be my Valentine, " + name + "?";
/* YES BUTTON */
function yesClicked() {
   // Play music (works because user clicked)
   document.getElementById("music").play();
   // Change text
   document.getElementById("question").innerHTML =
   "YAYYYYY 💕<br><br>I Love You Forever " + valentineName + " ❤️<br><br>You Are My Everything 💖";
   // Keep image visible
   document.getElementById("photo").style.width = "350px";
}
/* NO BUTTON */
function noClicked() {
   const messages = [
       "Are you sure? 🥺",
       "Think again 😜",
       "Wrong button madam 😏",
       "Only YES works here 😎",
       "My heart is breaking 💔",
       "Try pressing YES ❤️"
   ];
   const randomIndex = Math.floor(Math.random() * messages.length);
   alert(messages[randomIndex]);
}
</script>
</body>
</html>
